spring:
  datasource:
    url: jdbc:h2:mem:onboarding_diary;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

onboarding-diary:
  admin:
    email: ""
    password: ""
    name: Administrator
    department: Other
    start-date: ""
  jwt:
    secret: test-secret-key-for-onboarding-diary-integration-tests-0123456789
    expiry: PT8H
    cookie-name: ACCESS_TOKEN
    cookie-secure: false

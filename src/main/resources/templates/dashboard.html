<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('dashboard')}"></header>
<main class="page page-wide">
    <h1>Dashboard</h1>
    <p class="alert" id="page-alert" hidden></p>

    <section class="card">
        <div th:replace="~{fragments/layout :: recruitPicker}"></div>
        <button type="button" id="reload" class="inline">Show dashboard</button>
    </section>

    <section class="card">
        <h2>Summary</h2>
        <div class="stat-grid">
            <div class="stat"><span class="stat-label">Tasks</span><span class="stat-value" id="count-tasks">-</span></div>
            <div class="stat"><span class="stat-label">Issues</span><span class="stat-value" id="count-issues">-</span></div>
            <div class="stat"><span class="stat-label">Feedback notes</span><span class="stat-value" id="count-feedback">-</span></div>
            <div class="stat"><span class="stat-label">Additional notes</span><span class="stat-value" id="count-notes">-</span></div>
        </div>
        <h2>Task completion</h2>
        <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
        <p id="progress-text">-</p>
    </section>

    <section class="card">
        <h2>Open issues</h2>
        <table class="data-table">
            <thead>
            <tr><th>Date</th><th>Title</th><th>Severity</th><th>Status</th></tr>
            </thead>
            <tbody id="open-issues"></tbody>
        </table>
    </section>

    <section class="card">
        <h2>Recent entries</h2>
        <table class="data-table">
            <thead>
            <tr><th>Type</th><th>Date</th><th>Title</th></tr>
            </thead>
            <tbody id="recent-entries"></tbody>
        </table>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
<script>
    function targetUserId() {
        var input = document.getElementById('targetUserId');
        return input ? input.value : '';
    }

    function renderDashboard(data) {
        document.getElementById('count-tasks').textContent = data.counts.tasks;
        document.getElementById('count-issues').textContent = data.counts.issues;
        document.getElementById('count-feedback').textContent = data.counts.feedbackNotes;
        document.getElementById('count-notes').textContent = data.counts.additionalNotes;

        var completion = data.taskCompletion;
        document.getElementById('progress-bar').style.width = completion.percentComplete + '%';
        document.getElementById('progress-text').textContent =
            completion.completedTasks + ' of ' + completion.totalTasks + ' tasks completed ('
            + completion.percentComplete + '%)';

        document.getElementById('open-issues').innerHTML = data.openIssues.length === 0
            ? emptyRow(4, 'No open issues')
            : data.openIssues.map(function (issue) {
                return '<tr><td>' + escapeHtml(issue.entryDate) + '</td><td>' + escapeHtml(issue.title)
                    + '</td><td>' + escapeHtml(readableEnum(issue.severity)) + '</td><td>'
                    + escapeHtml(readableEnum(issue.status)) + '</td></tr>';
            }).join('');

        document.getElementById('recent-entries').innerHTML = data.recentEntries.length === 0
            ? emptyRow(3, 'No entries yet')
            : data.recentEntries.map(function (entry) {
                return '<tr><td>' + escapeHtml(readableEnum(entry.type)) + '</td><td>'
                    + escapeHtml(entry.entryDate) + '</td><td>' + escapeHtml(entry.title) + '</td></tr>';
            }).join('');
    }

    function loadDashboard() {
        apiGet('/api/dashboard' + queryString({ userId: targetUserId() }), renderDashboard);
    }

    document.getElementById('reload').addEventListener('click', loadDashboard);
    loadDashboard();
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${errorTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h4" th:text="${errorTitle}">Error</h1>
            <p class="mb-3" th:text="${errorMessage}">Something went wrong.</p>
            <a class="btn btn-primary" th:href="@{/dashboard}">Back to dashboard</a>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

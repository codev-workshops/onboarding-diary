<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' - Onboarding Diary'">Onboarding Diary</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body>
<!--/* Shared navigation (REQUIREMENTS 5.1 page table, 5.2 navigation). Each link is gated by the
       roles the table grants the page to; the Admin pages are not built yet, so no Admin entry
       exists. */-->
<header th:fragment="nav(active)" class="topnav" th:with="role=${profile.role().name()}">
    <div class="topnav-inner">
        <span class="brand">Onboarding Diary</span>
        <nav class="topnav-links">
            <a th:if="${#lists.contains({'NEW_RECRUIT', 'MANAGER', 'ADMIN'}, role)}"
               th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? ' active'">Dashboard</a>
            <a th:if="${#lists.contains({'NEW_RECRUIT', 'MANAGER', 'ADMIN'}, role)}"
               th:href="@{/tasks}" th:classappend="${active == 'tasks'} ? ' active'">Task Log</a>
            <a th:if="${#lists.contains({'NEW_RECRUIT', 'MANAGER', 'ADMIN'}, role)}"
               th:href="@{/issues}" th:classappend="${active == 'issues'} ? ' active'">Issue Log</a>
            <a th:if="${#lists.contains({'NEW_RECRUIT', 'MANAGER', 'ADMIN'}, role)}"
               th:href="@{/feedback}" th:classappend="${active == 'feedback'} ? ' active'">Feedback</a>
            <a th:if="${#lists.contains({'NEW_RECRUIT', 'MANAGER', 'ADMIN'}, role)}"
               th:href="@{/notes}" th:classappend="${active == 'notes'} ? ' active'">Notes</a>
            <a th:if="${#lists.contains({'NEW_RECRUIT', 'MANAGER', 'ADMIN'}, role)}"
               th:href="@{/reports}" th:classappend="${active == 'reports'} ? ' active'">Reports</a>
            <a th:if="${#lists.contains({'NEW_RECRUIT', 'MANAGER', 'ADMIN'}, role)}"
               th:href="@{/profile}" th:classappend="${active == 'profile'} ? ' active'">Profile</a>
        </nav>
        <!--/* Global search bar (REQUIREMENTS 9.5): submits to the /search page, and stays disabled
               below the minimum query length so the common case never reaches the server. */-->
        <form class="topnav-search" method="get" th:action="@{/search}">
            <label class="visually-hidden" for="nav-search-q">Search entries</label>
            <input type="search" id="nav-search-q" name="q" maxlength="100" placeholder="Search entries"
                   th:value="${param.q != null ? param.q[0] : ''}"/>
            <input th:if="${profile.role().name() != 'NEW_RECRUIT'}" type="text" id="nav-search-userId"
                   name="userId" inputmode="numeric" class="topnav-search-user" placeholder="Recruit id"
                   th:value="${param.userId != null ? param.userId[0] : ''}"/>
            <button type="submit" id="nav-search-submit" disabled>Search</button>
        </form>
        <div class="topnav-user">
            <span class="topnav-name" th:text="${profile.name()} + ' (' + ${role} + ')'"></span>
            <button type="button" id="logout" class="link-button">Log out</button>
        </div>
    </div>
</header>
<!--/* Recruit picker for the roles that may read another user's data (REQUIREMENTS 5.1). */-->
<div th:fragment="recruitPicker" th:if="${profile.role().name() != 'NEW_RECRUIT'}" class="recruit-picker">
    <label for="targetUserId">Recruit user id (blank shows your own data)
        <input type="text" id="targetUserId" name="targetUserId" inputmode="numeric" placeholder="e.g. 4"/>
    </label>
</div>
</body>
</html>

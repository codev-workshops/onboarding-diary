<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<main class="container">
    <div class="card auth-card shadow-sm">
        <div class="card-body">
            <h1 class="h4 mb-3">Sign in</h1>
            <div class="alert alert-danger" th:if="${param.error}">Invalid email or password, or the account is
                disabled.
            </div>
            <div class="alert alert-info" th:if="${param.logout}">You have been signed out.</div>
            <div class="alert alert-success" th:if="${param.registered}">Account created - please sign in.</div>
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" id="email" name="email" type="email" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" required minlength="8">
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign in</button>
            </form>
            <p class="mt-3 mb-0">New recruit? <a th:href="@{/signup}">Create an account</a></p>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

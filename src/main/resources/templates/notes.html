<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Additional Notes')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('notes')}"></header>
<main class="page page-wide">
    <h1>Additional Notes</h1>
    <p class="alert" id="page-alert" hidden></p>

    <section class="card">
        <h2>Filters</h2>
        <div th:replace="~{fragments/layout :: recruitPicker}"></div>
        <div class="filter-grid">
            <label for="filter-dateFrom">From<input type="date" id="filter-dateFrom"/></label>
            <label for="filter-dateTo">To<input type="date" id="filter-dateTo"/></label>
            <label for="filter-tag">Tag<input type="text" id="filter-tag" maxlength="30"/></label>
        </div>
        <div class="button-row">
            <button type="button" id="apply-filters" class="inline">Apply filters</button>
            <button type="button" id="reset-filters" class="inline secondary">Reset</button>
            <button type="button" id="new-note" class="inline">New note</button>
        </div>
    </section>

    <section class="card" id="form-card" hidden>
        <h2 id="form-title">New note</h2>
        <form id="note-form" novalidate>
            <p class="alert" hidden></p>
            <input type="hidden" id="note-id"/>
            <label for="entryDate">Date
                <input type="date" id="entryDate" name="entryDate" required/>
            </label>
            <span class="field-error" data-error-for="entryDate"></span>

            <label for="title">Title
                <input type="text" id="title" name="title" maxlength="150" required/>
            </label>
            <span class="field-error" data-error-for="title"></span>

            <label for="content">Content
                <textarea id="content" name="content" rows="6" maxlength="10000" required></textarea>
            </label>
            <span class="field-error" data-error-for="content"></span>

            <label for="tags">Tags (comma separated, at most 10)
                <input type="text" id="tags" name="tags" placeholder="onboarding, tooling"/>
            </label>
            <span class="field-error" data-error-for="tags"></span>

            <div class="button-row">
                <button type="submit" class="inline">Save note</button>
                <button type="button" id="cancel-form" class="inline secondary">Cancel</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Notes</h2>
        <table class="data-table">
            <thead>
            <tr><th>Date</th><th>Title</th><th>Content</th><th>Tags</th><th>Actions</th></tr>
            </thead>
            <tbody id="note-rows"></tbody>
        </table>
    </section>
</main>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
    var currentUserId = /*[[${profile.id()}]]*/ 0;
    var isAdmin = /*[[${profile.role().name() == 'ADMIN'}]]*/ false;
    var notes = [];

    function targetUserId() {
        var input = document.getElementById('targetUserId');
        return input ? input.value : '';
    }

    function mayEdit(note) {
        return isAdmin || note.ownerId === currentUserId;
    }

    function renderNotes() {
        document.getElementById('note-rows').innerHTML = notes.length === 0
            ? emptyRow(5, 'No notes match the current filters')
            : notes.map(function (note) {
                var actions = mayEdit(note)
                    ? '<button type="button" class="link-button" data-edit="' + note.id + '">Edit</button>'
                      + ' <button type="button" class="link-button danger" data-delete="' + note.id + '">Delete</button>'
                    : '<span class="muted">Read only</span>';
                return '<tr><td>' + escapeHtml(note.entryDate) + '</td><td>' + escapeHtml(note.title)
                    + '</td><td>' + escapeHtml(note.content) + '</td><td>'
                    + escapeHtml(note.tags.join(', ')) + '</td><td class="row-actions">' + actions + '</td></tr>';
            }).join('');
    }

    function loadNotes(successMessage) {
        var url = '/api/notes' + queryString({
            userId: targetUserId(),
            dateFrom: document.getElementById('filter-dateFrom').value,
            dateTo: document.getElementById('filter-dateTo').value,
            tag: document.getElementById('filter-tag').value
        });
        apiGet(url, function (payload) {
            notes = payload;
            renderNotes();
            if (successMessage) {
                pageAlert(successMessage, 'success');
            }
        });
    }

    function parseTags(value) {
        return value.split(',').map(function (tag) {
            return tag.trim();
        }).filter(function (tag) {
            return tag !== '';
        });
    }

    function openForm(note) {
        var form = document.getElementById('note-form');
        clearErrors(form);
        document.getElementById('form-card').hidden = false;
        document.getElementById('form-title').textContent = note ? 'Edit note' : 'New note';
        document.getElementById('note-id').value = note ? note.id : '';
        form.entryDate.value = note ? note.entryDate : '';
        form.title.value = note ? note.title : '';
        form.content.value = note ? note.content : '';
        form.tags.value = note ? note.tags.join(', ') : '';
    }

    document.getElementById('new-note').addEventListener('click', function () {
        openForm(null);
    });

    document.getElementById('cancel-form').addEventListener('click', function () {
        document.getElementById('form-card').hidden = true;
    });

    document.getElementById('apply-filters').addEventListener('click', function () {
        loadNotes();
    });

    document.getElementById('reset-filters').addEventListener('click', function () {
        document.getElementById('filter-dateFrom').value = '';
        document.getElementById('filter-dateTo').value = '';
        document.getElementById('filter-tag').value = '';
        loadNotes();
    });

    document.getElementById('note-rows').addEventListener('click', function (event) {
        var editId = event.target.getAttribute('data-edit');
        var deleteId = event.target.getAttribute('data-delete');
        if (editId) {
            openForm(notes.filter(function (note) {
                return String(note.id) === editId;
            })[0]);
        } else if (deleteId && window.confirm('Delete this note?')) {
            apiDelete('/api/notes/' + deleteId, function () {
                loadNotes('Note deleted');
            });
        }
    });

    document.getElementById('note-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var form = event.target;
        var id = document.getElementById('note-id').value;
        submitJson(form, id ? '/api/notes/' + id : '/api/notes', id ? 'PUT' : 'POST', {
            entryDate: form.entryDate.value,
            title: form.title.value,
            content: form.content.value,
            tags: parseTags(form.tags.value)
        }, function () {
            document.getElementById('form-card').hidden = true;
            loadNotes(id ? 'Note updated' : 'Note created');
        });
    });

    loadNotes();
</script>
</body>
</html>

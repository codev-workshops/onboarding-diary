<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Issues')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Issues</h1>
        <a class="btn btn-primary" th:href="@{/issues/new}">Log issue</a>
    </div>

    <form class="card card-body shadow-sm mb-3" method="get" th:action="@{/issues}">
        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-3">
                <label class="form-label" for="from">From</label>
                <input class="form-control" id="from" type="date" name="from" th:value="${filter.from}">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="to">To</label>
                <input class="form-control" id="to" type="date" name="to" th:value="${filter.to}">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="status">Status</label>
                <select class="form-select" id="status" name="status">
                    <option value="">All</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                            th:selected="${s == filter.status}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="severity">Severity</label>
                <select class="form-select" id="severity" name="severity">
                    <option value="">All</option>
                    <option th:each="s : ${severities}" th:value="${s}" th:text="${s}"
                            th:selected="${s == filter.severity}"></option>
                </select>
            </div>
            <div class="col-12 col-md-1 d-grid">
                <button class="btn btn-outline-primary" type="submit">Filter</button>
            </div>
        </div>
    </form>

    <p class="text-muted" th:if="${#lists.isEmpty(issues)}">No issues match the current filters.</p>
    <div class="table-responsive shadow-sm" th:unless="${#lists.isEmpty(issues)}">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th scope="col">Date</th>
                <th scope="col">Title</th>
                <th scope="col">Severity</th>
                <th scope="col">Status</th>
                <th scope="col" class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="issue : ${issues}">
                <td th:text="${issue.date}">date</td>
                <td>
                    <span th:text="${issue.title}">title</span>
                    <div class="snippet" th:text="${issue.description}"></div>
                </td>
                <td><span class="badge bg-warning text-dark" th:text="${issue.severity}">severity</span></td>
                <td><span class="badge bg-secondary" th:text="${issue.status}">status</span></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{'/issues/edit/' + ${issue.id}}">Edit</a>
                    <form class="d-inline" method="post" th:action="@{'/issues/delete/' + ${issue.id}}"
                          onsubmit="return confirm('Delete this issue?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tasks')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Tasks</h1>
        <a class="btn btn-primary" th:href="@{/tasks/new}">Add task</a>
    </div>

    <form class="card card-body shadow-sm mb-3" method="get" th:action="@{/tasks}">
        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-3">
                <label class="form-label" for="from">From</label>
                <input class="form-control" id="from" type="date" name="from" th:value="${filter.from}">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="to">To</label>
                <input class="form-control" id="to" type="date" name="to" th:value="${filter.to}">
            </div>
            <div class="col-6 col-md-3">
                <label class="form-label" for="category">Category</label>
                <select class="form-select" id="category" name="category">
                    <option value="">All</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"
                            th:selected="${cat == filter.category}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="status">Status</label>
                <select class="form-select" id="status" name="status">
                    <option value="">All</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                            th:selected="${s == filter.status}"></option>
                </select>
            </div>
            <div class="col-12 col-md-1 d-grid">
                <button class="btn btn-outline-primary" type="submit">Filter</button>
            </div>
        </div>
    </form>

    <p class="text-muted" th:if="${#lists.isEmpty(tasks)}">No tasks match the current filters.</p>
    <div class="table-responsive shadow-sm" th:unless="${#lists.isEmpty(tasks)}">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th scope="col">Date</th>
                <th scope="col">Title</th>
                <th scope="col">Category</th>
                <th scope="col">Status</th>
                <th scope="col">Priority</th>
                <th scope="col" class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}"
                th:classappend="${task.status.name() != 'COMPLETED' and task.date.isBefore(overdueBefore)} ? 'table-warning' : ''">
                <td th:text="${task.date}">date</td>
                <td>
                    <span th:text="${task.title}">title</span>
                    <div class="snippet" th:text="${task.description}"></div>
                </td>
                <td th:text="${task.category}">category</td>
                <td><span class="badge bg-secondary" th:text="${task.status}">status</span></td>
                <td th:text="${task.priority}">priority</td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{'/tasks/edit/' + ${task.id}}">Edit</a>
                    <form class="d-inline" method="post" th:action="@{'/tasks/delete/' + ${task.id}}"
                          onsubmit="return confirm('Delete this task?');">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Note')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3" th:text="${noteId != null} ? 'Edit note' : 'New note'">Note</h1>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:object="${noteForm}" method="post"
                  th:action="${noteId != null} ? @{'/notes/edit/' + ${noteId}} : @{/notes}" novalidate>
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="date">Date</label>
                        <input class="form-control" id="date" type="date" th:field="*{date}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                    </div>
                    <div class="col-12 col-md-8">
                        <label class="form-label" for="title">Title</label>
                        <input class="form-control" id="title" th:field="*{title}" required minlength="3"
                               maxlength="150">
                        <div class="text-danger small" th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="content">Content</label>
                        <textarea class="form-control" id="content" rows="8" th:field="*{content}" required
                                  maxlength="10000"></textarea>
                        <div class="text-danger small" th:if="${#fields.hasErrors('content')}"
                             th:errors="*{content}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="tags">Tags</label>
                        <input class="form-control" id="tags" th:field="*{tags}" maxlength="500"
                               placeholder="comma,separated">
                        <div class="text-danger small" th:if="${#fields.hasErrors('tags')}" th:errors="*{tags}"></div>
                    </div>
                </div>
                <div class="mt-3">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-link" th:href="@{/notes}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Task Log')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('tasks')}"></header>
<main class="page page-wide">
    <h1>Task Log</h1>
    <p class="alert" id="page-alert" hidden></p>

    <section class="card">
        <h2>Filters</h2>
        <div th:replace="~{fragments/layout :: recruitPicker}"></div>
        <div class="filter-grid">
            <label for="filter-dateFrom">From<input type="date" id="filter-dateFrom"/></label>
            <label for="filter-dateTo">To<input type="date" id="filter-dateTo"/></label>
            <label for="filter-category">Category
                <select id="filter-category"><option value="">All</option></select>
            </label>
            <label for="filter-status">Status
                <select id="filter-status">
                    <option value="">All</option>
                    <option value="NOT_STARTED">Not started</option>
                    <option value="IN_PROGRESS">In progress</option>
                    <option value="BLOCKED">Blocked</option>
                    <option value="COMPLETED">Completed</option>
                </select>
            </label>
        </div>
        <div class="button-row">
            <button type="button" id="apply-filters" class="inline">Apply filters</button>
            <button type="button" id="reset-filters" class="inline secondary">Reset</button>
            <button type="button" id="new-task" class="inline">New task</button>
        </div>
    </section>

    <section class="card" id="form-card" hidden>
        <h2 id="form-title">New task</h2>
        <form id="task-form" novalidate>
            <p class="alert" hidden></p>
            <input type="hidden" id="task-id"/>
            <label for="entryDate">Date
                <input type="date" id="entryDate" name="entryDate" required/>
            </label>
            <span class="field-error" data-error-for="entryDate"></span>

            <label for="title">Title
                <input type="text" id="title" name="title" maxlength="150" required/>
            </label>
            <span class="field-error" data-error-for="title"></span>

            <label for="description">Description
                <textarea id="description" name="description" rows="4" maxlength="5000"></textarea>
            </label>
            <span class="field-error" data-error-for="description"></span>

            <label for="category">Category
                <select id="category" name="category" required></select>
            </label>
            <span class="field-error" data-error-for="category"></span>

            <label for="status">Status
                <select id="status" name="status">
                    <option value="NOT_STARTED">Not started</option>
                    <option value="IN_PROGRESS">In progress</option>
                    <option value="BLOCKED">Blocked</option>
                    <option value="COMPLETED">Completed</option>
                </select>
            </label>
            <span class="field-error" data-error-for="status"></span>

            <label for="priority">Priority
                <select id="priority" name="priority">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HIGH">High</option>
                </select>
            </label>
            <span class="field-error" data-error-for="priority"></span>

            <div class="button-row">
                <button type="submit" class="inline">Save task</button>
                <button type="button" id="cancel-form" class="inline secondary">Cancel</button>
            </div>
        </form>
    </section>

    <section class="card">
        <h2>Tasks</h2>
        <table class="data-table">
            <thead>
            <tr><th>Date</th><th>Title</th><th>Category</th><th>Status</th><th>Priority</th><th>Actions</th></tr>
            </thead>
            <tbody id="task-rows"></tbody>
        </table>
    </section>
</main>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:inline="javascript">
    var currentUserId = /*[[${profile.id()}]]*/ 0;
    var isAdmin = /*[[${profile.role().name() == 'ADMIN'}]]*/ false;
    var tasks = [];

    function targetUserId() {
        var input = document.getElementById('targetUserId');
        return input ? input.value : '';
    }

    function mayEdit(task) {
        return isAdmin || task.ownerId === currentUserId;
    }

    function renderTasks() {
        document.getElementById('task-rows').innerHTML = tasks.length === 0
            ? emptyRow(6, 'No tasks match the current filters')
            : tasks.map(function (task) {
                var actions = mayEdit(task)
                    ? '<button type="button" class="link-button" data-edit="' + task.id + '">Edit</button>'
                      + ' <button type="button" class="link-button danger" data-delete="' + task.id + '">Delete</button>'
                    : '<span class="muted">Read only</span>';
                return '<tr><td>' + escapeHtml(task.entryDate) + '</td><td>' + escapeHtml(task.title)
                    + '</td><td>' + escapeHtml(task.category) + '</td><td>'
                    + escapeHtml(readableEnum(task.status)) + '</td><td>'
                    + escapeHtml(readableEnum(task.priority)) + '</td><td class="row-actions">' + actions
                    + '</td></tr>';
            }).join('');
    }

    function loadTasks(successMessage) {
        var url = '/api/tasks' + queryString({
            userId: targetUserId(),
            dateFrom: document.getElementById('filter-dateFrom').value,
            dateTo: document.getElementById('filter-dateTo').value,
            category: document.getElementById('filter-category').value,
            status: document.getElementById('filter-status').value
        });
        apiGet(url, function (payload) {
            tasks = payload;
            renderTasks();
            if (successMessage) {
                pageAlert(successMessage, 'success');
            }
        });
    }

    function loadCategories() {
        apiGet('/api/categories', function (categories) {
            var options = categories.map(function (category) {
                return '<option value="' + escapeHtml(category.name) + '">' + escapeHtml(category.name)
                    + '</option>';
            }).join('');
            document.getElementById('category').innerHTML = options;
            document.getElementById('filter-category').innerHTML = '<option value="">All</option>' + options;
        });
    }

    function openForm(task) {
        var form = document.getElementById('task-form');
        clearErrors(form);
        document.getElementById('form-card').hidden = false;
        document.getElementById('form-title').textContent = task ? 'Edit task' : 'New task';
        document.getElementById('task-id').value = task ? task.id : '';
        form.entryDate.value = task ? task.entryDate : '';
        form.title.value = task ? task.title : '';
        form.description.value = task && task.description ? task.description : '';
        form.category.value = task ? task.category : form.category.value;
        form.status.value = task ? task.status : 'NOT_STARTED';
        form.priority.value = task ? task.priority : 'MEDIUM';
    }

    document.getElementById('new-task').addEventListener('click', function () {
        openForm(null);
    });

    document.getElementById('cancel-form').addEventListener('click', function () {
        document.getElementById('form-card').hidden = true;
    });

    document.getElementById('apply-filters').addEventListener('click', function () {
        loadTasks();
    });

    document.getElementById('reset-filters').addEventListener('click', function () {
        document.getElementById('filter-dateFrom').value = '';
        document.getElementById('filter-dateTo').value = '';
        document.getElementById('filter-category').value = '';
        document.getElementById('filter-status').value = '';
        loadTasks();
    });

    document.getElementById('task-rows').addEventListener('click', function (event) {
        var editId = event.target.getAttribute('data-edit');
        var deleteId = event.target.getAttribute('data-delete');
        if (editId) {
            openForm(tasks.filter(function (task) {
                return String(task.id) === editId;
            })[0]);
        } else if (deleteId && window.confirm('Delete this task?')) {
            apiDelete('/api/tasks/' + deleteId, function () {
                loadTasks('Task deleted');
            });
        }
    });

    document.getElementById('task-form').addEventListener('submit', function (event) {
        event.preventDefault();
        var form = event.target;
        var id = document.getElementById('task-id').value;
        submitJson(form, id ? '/api/tasks/' + id : '/api/tasks', id ? 'PUT' : 'POST', {
            entryDate: form.entryDate.value,
            title: form.title.value,
            description: form.description.value,
            category: form.category.value,
            status: form.status.value,
            priority: form.priority.value
        }, function () {
            document.getElementById('form-card').hidden = true;
            loadTasks(id ? 'Task updated' : 'Task created');
        });
    });

    loadCategories();
    loadTasks();
</script>
</body>
</html>

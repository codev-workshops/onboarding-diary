<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Feedback')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <h1 class="h3 mb-3" th:text="${feedbackId != null} ? 'Edit feedback' : 'Give feedback'">Feedback</h1>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:object="${feedbackForm}" method="post"
                  th:action="${feedbackId != null} ? @{'/feedback/edit/' + ${feedbackId}} : @{/feedback}" novalidate>
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label" for="date">Date</label>
                        <input class="form-control" id="date" type="date" th:field="*{date}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
                    </div>
                    <div class="col-12 col-md-5">
                        <label class="form-label" for="subject">Subject</label>
                        <input class="form-control" id="subject" th:field="*{subject}" required minlength="3"
                               maxlength="150">
                        <div class="text-danger small" th:if="${#fields.hasErrors('subject')}"
                             th:errors="*{subject}"></div>
                    </div>
                    <div class="col-12 col-md-3">
                        <label class="form-label" for="type">Type</label>
                        <select class="form-select" id="type" th:field="*{type}">
                            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="details">Details</label>
                        <textarea class="form-control" id="details" rows="6" th:field="*{details}" required
                                  minlength="3" maxlength="5000"></textarea>
                        <div class="text-danger small" th:if="${#fields.hasErrors('details')}"
                             th:errors="*{details}"></div>
                    </div>
                </div>
                <div class="mt-3">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-link" th:href="@{/feedback}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>

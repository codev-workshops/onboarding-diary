spring:
  application:
    name: onboarding-diary
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onboarding_diary}
    username: ${DB_USER:onboarding_diary}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # db/migration is portable ANSI SQL; db/migration-postgresql is a sibling (Flyway scans a
    # location recursively) holding the PostgreSQL-only migrations - the pg_trgm search indexes -
    # which the H2 test database does not load.
    locations: classpath:db/migration,classpath:db/migration-postgresql
    baseline-on-migrate: false
  thymeleaf:
    cache: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

onboarding-diary:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Administrator}
    department: ${ADMIN_DEPARTMENT:Other}
    start-date: ${ADMIN_START_DATE:}
  jwt:
    secret: ${JWT_SECRET:}
    expiry: ${JWT_EXPIRY:PT8H}
    cookie-name: ACCESS_TOKEN
    cookie-secure: ${JWT_COOKIE_SECURE:false}

logging:
  level:
    root: INFO

spring:
  application:
    name: onboarding-diary
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onboarding_diary}
    username: ${DB_USERNAME:diary}
    password: ${DB_PASSWORD:diary}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  servlet:
    multipart:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
    password: ${DEMO_PASSWORD:Password123!}

logging:
  level:
    root: INFO
    com.codev.onboardingdiary: INFO

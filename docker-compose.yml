version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - onboarding-net

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - diary-service
      - report-service
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - DIARY_SERVICE_URL=http://diary-service:8082
      - REPORT_SERVICE_URL=http://report-service:8083
    networks:
      - onboarding-net

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - sqlite-data:/app/data
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/auth.db
      - JWT_SECRET=onboarding-diary-secret-key-change-in-production-minimum-256-bits
      - SERVER_PORT=8081
    networks:
      - onboarding-net

  diary-service:
    build:
      context: ./backend
      dockerfile: diary-service/Dockerfile
    ports:
      - "8082:8082"
    volumes:
      - sqlite-data:/app/data
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/diary.db
      - JWT_SECRET=onboarding-diary-secret-key-change-in-production-minimum-256-bits
      - AUTH_SERVICE_URL=http://auth-service:8081
      - SERVER_PORT=8082
    networks:
      - onboarding-net

  report-service:
    build:
      context: ./backend
      dockerfile: report-service/Dockerfile
    ports:
      - "8083:8083"
    volumes:
      - sqlite-data:/app/data
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/reports.db
      - JWT_SECRET=onboarding-diary-secret-key-change-in-production-minimum-256-bits
      - DIARY_SERVICE_URL=http://diary-service:8082
      - AUTH_SERVICE_URL=http://auth-service:8081
      - SERVER_PORT=8083
    networks:
      - onboarding-net

volumes:
  sqlite-data:
    driver: local

networks:
  onboarding-net:
    driver: bridge

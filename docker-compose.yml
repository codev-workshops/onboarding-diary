services:
  db:
    image: postgres:16-alpine
    container_name: onboarding-diary-db
    environment:
      POSTGRES_DB: ${DB_NAME:-onboarding_diary}
      POSTGRES_USER: ${DB_USER:-onboarding_diary}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-onboarding_diary} -d ${DB_NAME:-onboarding_diary}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onboarding}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onboarding}
      POSTGRES_DB: ${POSTGRES_DB:-onboarding_diary}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-onboarding} -d ${POSTGRES_DB:-onboarding_diary}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:24-bookworm-slim
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace @onboarding-diary/api"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://onboarding:onboarding@postgres:5432/onboarding_diary?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string-of-at-least-32-chars}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PORT: ${PORT:-4000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${PORT:-4000}:4000'
    volumes:
      - .:/workspace
      - api-node-modules:/workspace/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24-bookworm-slim
    working_dir: /workspace
    command: sh -c "npm install && npm run dev --workspace @onboarding-diary/web"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api/v1}
    ports:
      - '${WEB_PORT:-5173}:5173'
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
  api-node-modules:
  web-node-modules:

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: onboarding
      POSTGRES_DB: onboarding_diary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding_diary"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/onboarding_diary
      DB_USERNAME: onboarding
      DB_PASSWORD: onboarding
      JWT_SECRET: dev-only-secret-change-me-please-32bytes-minimum!!
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      SEED_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:

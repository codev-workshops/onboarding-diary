spring:
  application:
    name: onboarding-diary
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onboarding_diary}
    username: ${DB_USERNAME:onboarding}
    password: ${DB_PASSWORD:onboarding}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Override in every environment. Must be at least 32 bytes for HS256.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-minimum!!}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
    issuer: onboarding-diary
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@onboardingdiary.local}
    admin-name: ${SEED_ADMIN_NAME:Default Admin}
    admin-password: ${SEED_ADMIN_PASSWORD:ChangeMe!2026}

logging:
  level:
    org.springframework.security: INFO

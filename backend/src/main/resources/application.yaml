spring:
  application:
    name: onboarding-diary-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onboarding_diary}
    username: ${DB_USERNAME:onboarding}
    password: ${DB_PASSWORD:onboarding}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      probes:
        enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

spring.application.name=onboarding-diary

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:onboarding_diary}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyMustBeAtLeast256BitsLong12345}
app.jwt.expiration-ms=86400000

# Server
server.port=8080

# Social OAuth
app.twitter.client-id=${TWITTER_CLIENT_ID:}
app.twitter.client-secret=${TWITTER_CLIENT_SECRET:}
app.linkedin.client-id=${LINKEDIN_CLIENT_ID:}
app.linkedin.client-secret=${LINKEDIN_CLIENT_SECRET:}
app.facebook.app-id=${FACEBOOK_APP_ID:}
app.facebook.app-secret=${FACEBOOK_APP_SECRET:}

app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

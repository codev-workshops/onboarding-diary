spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

app.jwt.secret=testSecretKeyForTestingOnlyMustBeAtLeast256BitsLongEnoughForHS256Algorithm
app.jwt.expiration-ms=86400000

app.twitter.client-id=test-twitter-id
app.twitter.client-secret=test-twitter-secret
app.linkedin.client-id=test-linkedin-id
app.linkedin.client-secret=test-linkedin-secret
app.facebook.app-id=test-facebook-id
app.facebook.app-secret=test-facebook-secret

app.base-url=http://localhost:8080
app.frontend-url=http://localhost:5173

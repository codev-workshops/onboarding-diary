server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: diary-tasks
          uri: ${DIARY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/tasks/**
        - id: diary-issues
          uri: ${DIARY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/issues/**
        - id: diary-feedback
          uri: ${DIARY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/feedback/**
        - id: diary-notes
          uri: ${DIARY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/notes/**
        - id: diary-dashboard
          uri: ${DIARY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/dashboard/**
        - id: report-service
          uri: ${REPORT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/reports/**

server:
  port: 8082

spring:
  application:
    name: diary-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:data/diary.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:onboarding-diary-secret-key-change-in-production-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}

auth-service:
  url: ${AUTH_SERVICE_URL:http://localhost:8081}

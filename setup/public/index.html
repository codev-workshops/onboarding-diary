<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onboarding Diary — Production Setup</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        width: min(560px, 92vw);
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 28px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 4px;
      }
      p.sub {
        margin: 0 0 20px;
        color: #94a3b8;
        font-size: 0.9rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin: 14px 0 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: inherit;
        font-size: 0.95rem;
      }
      button {
        margin-top: 22px;
        width: 100%;
        padding: 11px;
        border: 0;
        border-radius: 8px;
        background: #6366f1;
        color: white;
        font-size: 1rem;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }
      #result {
        margin-top: 18px;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .ok {
        color: #4ade80;
      }
      .err {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Move to production</h1>
      <p class="sub">
        Run once, from demo mode. This creates the production schema, seeds reference data, and
        sets your real administrator. Restart the server afterward.
      </p>
      <form id="form">
        <label for="dbString">PostgreSQL connection string (DB_STRING)</label>
        <input id="dbString" name="dbString" required placeholder="postgresql://user:pass@host:5432/db" />
        <label for="adminEmail">Admin email</label>
        <input id="adminEmail" name="adminEmail" type="email" required />
        <label for="adminName">Admin name</label>
        <input id="adminName" name="adminName" required />
        <label for="timezone">Admin timezone (optional)</label>
        <input id="timezone" name="timezone" placeholder="Asia/Kolkata" />
        <label for="adminPassword">Admin password (min 8 characters)</label>
        <input id="adminPassword" name="adminPassword" type="password" required />
        <button type="submit">Provision production database</button>
      </form>
      <div id="result"></div>
    </main>
    <script>
      const form = document.getElementById('form');
      const result = document.getElementById('result');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;
        result.textContent = 'Provisioning…';
        result.className = '';
        const body = Object.fromEntries(new FormData(form).entries());
        try {
          const res = await fetch('/provision', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Provisioning failed');
          result.className = 'ok';
          const lines = [
            `Success. Admin ${data.adminCreated ? 'created' : 'already present'} (${data.adminEmail}). ` +
              `${data.categoriesCreated} categories seeded.`,
            '',
            data.envWritten
              ? `Wrote ${data.envPath} (DB_STRING + JWT_SECRET, mode 0600). On cloud a written .env will NOT survive a redeploy — set the env vars in your platform instead:`
              : `Could not write .env (read-only/ephemeral filesystem, typical on cloud). Set these env vars in your platform:`,
            `  DB_STRING=${body.dbString}`,
          ];
          if (data.jwtSecretGenerated && data.jwtSecret) {
            lines.push(
              `  JWT_SECRET=${data.jwtSecret}`,
              '(Copy the JWT_SECRET now — it is shown only once and is not stored anywhere else.)',
            );
          } else {
            lines.push('  JWT_SECRET=(reusing the existing strong secret already in server/.env)');
          }
          lines.push(
            '',
            'Next: restart the server (it will start in production mode), then stop this setup tool.',
          );
          result.textContent = lines.join('\n');
        } catch (err) {
          result.className = 'err';
          result.textContent = err.message;
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
